<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cut preview demo — Solis timeline</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
  }

  .demo-shell {
    width: min(640px, 100%);
    background: #fff;
    border-radius: 20px;
    border: 1px solid rgba(15, 23, 42, 0.08);
    padding: 20px 20px 24px;
  }

  .demo-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #64748b;
    margin: 0 0 6px;
  }

  .demo-title {
    margin: 0 0 4px;
    font-size: 18px;
    font-weight: 700;
  }

  .demo-copy {
    margin: 0 0 18px;
    font-size: 13px;
    color: #64748b;
    line-height: 1.45;
  }

  .demo-stage {
    background: linear-gradient(180deg, #fafafa 0%, #f4f4f5 100%);
    border-radius: 16px;
    padding: 16px 14px 14px;
    border: 1px solid rgba(15, 23, 42, 0.06);
  }

  .silencer-note {
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    color: #475569;
    margin-bottom: 10px;
    min-height: 18px;
  }

  .preview-timeline-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .preview-timeline-time {
    font-size: 11px;
    font-weight: 700;
    color: #64748b;
    min-width: 28px;
    font-variant-numeric: tabular-nums;
  }

  .preview-timeline-time-end { color: #94a3b8; }

  .preview-timeline-wrap {
    position: relative;
    flex: 1;
    height: 44px;
    border-radius: 12px;
    overflow: visible;
    isolation: isolate;
    background: rgba(255, 255, 255, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.8);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.7) inset,
      0 2px 10px rgba(15, 23, 42, 0.06);
    transition: box-shadow 0.2s ease;
  }

  .preview-timeline-wrap.has-cut-preview {
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.7) inset,
      0 2px 10px rgba(15, 23, 42, 0.06),
      0 0 0 2px rgba(239, 68, 68, 0.28);
  }

  .preview-timeline-cut-actions {
    position: absolute;
    top: 50%;
    right: 6px;
    transform: translateY(-50%);
    z-index: 10;
    display: inline-flex;
    gap: 2px;
    align-items: center;
    padding: 3px 4px;
    border-radius: 999px;
    pointer-events: auto;
    background: linear-gradient(145deg, rgba(255,255,255,.96), rgba(255,252,248,.88));
    border: 1px solid rgba(255,255,255,.95);
    box-shadow:
      0 6px 18px rgba(120,90,60,.12),
      0 1px 4px rgba(120,90,60,.06),
      inset 0 1px 0 rgba(255,255,255,1);
  }

  .preview-timeline-cut-actions.hidden { display: none; }

  .preview-timeline-filmstrip {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background:
      linear-gradient(90deg,
        #cbd5e1 0%, #e2e8f0 8%, #94a3b8 16%, #cbd5e1 24%,
        #e2e8f0 32%, #94a3b8 40%, #cbd5e1 48%, #e2e8f0 56%,
        #94a3b8 64%, #cbd5e1 72%, #e2e8f0 80%, #94a3b8 88%, #cbd5e1 100%);
    opacity: 0.85;
  }

  .preview-timeline-playhead {
    position: absolute;
    top: -2px;
    bottom: -2px;
    left: 38%;
    width: 2px;
    background: #fff;
    box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.25);
    z-index: 6;
    border-radius: 1px;
  }

  .preview-timeline-playhead::after {
    content: '';
    position: absolute;
    top: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 10px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.2);
  }

  .preview-timeline-cut-preview {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 4;
    border-radius: inherit;
  }

  .preview-timeline-cut-preview > i {
    position: absolute;
    top: 0;
    bottom: 0;
    background: repeating-linear-gradient(
      -45deg,
      rgba(239, 68, 68, 0.62),
      rgba(239, 68, 68, 0.62) 3px,
      rgba(239, 68, 68, 0.28) 3px,
      rgba(239, 68, 68, 0.28) 6px
    );
    border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(220, 38, 38, 0.55);
  }

  .preview-timeline-silence-cuts {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    border-radius: inherit;
  }

  .preview-timeline-silence-cuts > i {
    position: absolute;
    top: 0;
    bottom: 0;
    background: repeating-linear-gradient(
      -45deg,
      rgba(15, 23, 42, 0.28),
      rgba(15, 23, 42, 0.28) 3px,
      rgba(15, 23, 42, 0.08) 3px,
      rgba(15, 23, 42, 0.08) 6px
    );
    border-radius: 2px;
  }

  .sub-mem-btn {
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }

  .sub-mem-decline {
    background: linear-gradient(145deg, rgba(255,255,255,.75), rgba(255,255,255,.4));
    border: 1px solid rgba(200,185,170,.35);
    color: rgba(50,38,28,.72);
  }

  .sub-mem-accept {
    background: linear-gradient(145deg, #34d399 0%, #16a34a 100%);
    border: 1px solid rgba(21,128,61,.35);
    color: #fff;
  }

  .demo-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }

  .demo-btn {
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid rgba(15, 23, 42, 0.12);
    background: #fff;
    cursor: pointer;
  }

  .demo-btn.primary {
    background: #0f172a;
    color: #fff;
    border-color: #0f172a;
  }

  .demo-legend {
    display: flex;
    gap: 16px;
    margin-top: 14px;
    font-size: 11px;
    color: #64748b;
  }

  .demo-legend span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .swatch {
    width: 14px;
    height: 14px;
    border-radius: 3px;
  }

  .swatch.red {
    background: repeating-linear-gradient(-45deg, rgba(239,68,68,.62), rgba(239,68,68,.62) 2px, rgba(239,68,68,.28) 2px, rgba(239,68,68,.28) 4px);
    border: 1px solid rgba(220,38,38,.45);
  }

  .swatch.dark {
    background: repeating-linear-gradient(-45deg, rgba(15,23,42,.28), rgba(15,23,42,.28) 2px, rgba(15,23,42,.08) 2px, rgba(15,23,42,.08) 4px);
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="demo-shell">
  <p class="demo-label">Live preview mock</p>
  <h1 class="demo-title">Remove silence · Accept / Reject</h1>
  <p class="demo-copy">This is how the library timeline looks after you tap Remove silence or Improve clip — red = pending removal. Nothing changes until you accept.</p>

  <div class="demo-stage">
    <div class="silencer-note" id="hint">Red = 4.2s silence · Accept?</div>

    <div class="preview-timeline-row">
      <span class="preview-timeline-time">0:00</span>
      <div class="preview-timeline-wrap has-cut-preview" id="timeline">
        <div class="preview-timeline-filmstrip"></div>
        <div class="preview-timeline-cut-preview" id="cutPreview">
          <i style="left:18%; width:8%"></i>
          <i style="left:52%; width:11%"></i>
          <i style="left:78%; width:6%"></i>
        </div>
        <div class="preview-timeline-silence-cuts hidden" id="cutApplied"></div>
        <div class="preview-timeline-playhead"></div>
        <div class="preview-timeline-cut-actions" id="actions">
          <button type="button" class="sub-mem-btn sub-mem-decline" id="btnReject" title="Dismiss" aria-label="Dismiss">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2.35" stroke-linecap="round"/></svg>
          </button>
          <button type="button" class="sub-mem-btn sub-mem-accept" id="btnAccept" title="Apply" aria-label="Apply">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4.5 10.2l3.4 3.4 7.6-7.8" stroke="currentColor" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <span class="preview-timeline-time preview-timeline-time-end">0:42</span>
    </div>
  </div>

  <div class="demo-controls">
    <button type="button" class="demo-btn primary" id="btnReset">Reset demo</button>
    <button type="button" class="demo-btn" id="btnSilence">Remove silence</button>
    <button type="button" class="demo-btn" id="btnImprove">Improve clip</button>
  </div>

  <div class="demo-legend">
    <span><i class="swatch red"></i> Pending (preview)</span>
    <span><i class="swatch dark"></i> Applied after Accept</span>
  </div>
</div>

<script>
  const CUTS = [
    { start: 0.18, end: 0.26 },
    { start: 0.52, end: 0.63 },
    { start: 0.78, end: 0.84 },
  ];

  const hint = document.getElementById('hint');
  const timeline = document.getElementById('timeline');
  const cutPreview = document.getElementById('cutPreview');
  const cutApplied = document.getElementById('cutApplied');
  const actions = document.getElementById('actions');

  function renderCuts(el, cuts) {
    el.innerHTML = cuts.map(c => {
      const left = (c.start * 100).toFixed(1);
      const w = ((c.end - c.start) * 100).toFixed(1);
      return `<i style="left:${left}%; width:${w}%"></i>`;
    }).join('');
  }

  function showPreview(label) {
    timeline.classList.add('has-cut-preview');
    cutPreview.classList.remove('hidden');
    cutApplied.classList.add('hidden');
    cutApplied.innerHTML = '';
    actions.classList.remove('hidden');
    hint.textContent = label;
  }

  function accept() {
    timeline.classList.remove('has-cut-preview');
    cutPreview.classList.add('hidden');
    cutApplied.classList.remove('hidden');
    renderCuts(cutApplied, CUTS);
    actions.classList.add('hidden');
    hint.textContent = 'Removed 4.2s of silence';
  }

  function reject() {
    timeline.classList.remove('has-cut-preview');
    cutPreview.classList.add('hidden');
    cutApplied.classList.add('hidden');
    actions.classList.add('hidden');
    hint.textContent = 'Silence cleanup dismissed';
  }

  function reset() {
    timeline.classList.add('has-cut-preview');
    cutPreview.classList.remove('hidden');
    renderCuts(cutPreview, CUTS);
    cutApplied.classList.add('hidden');
    actions.classList.remove('hidden');
    hint.textContent = 'Red = 4.2s silence · Accept?';
  }

  document.getElementById('btnAccept').onclick = accept;
  document.getElementById('btnReject').onclick = reject;
  document.getElementById('btnReset').onclick = reset;
  document.getElementById('btnSilence').onclick = () =>
    showPreview('Red = 4.2s silence · Accept?');
  document.getElementById('btnImprove').onclick = () =>
    showPreview('Red = ~4.2s to trim · Improve uses 1 upload');

  renderCuts(cutPreview, CUTS);
</script>
</body>
</html>
