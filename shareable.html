<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <title>Solis AI</title>
  <meta name="description" content="Watch Solis AI clips and follow creators." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Solis AI" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/genfavicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/genfavicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style/ss/badges.css" />
  <script defer src="/js/core/init.js?v=5"></script>
  <script defer src="/js/core/api-client.js?v=1"></script>
  <script defer src="/js/ui/solis-badges.js?v=4"></script>
  <script defer src="/js/public-shareable.js?v=3"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --solis: #f97316;
      --text-primary: #18120e;
      --text-secondary: #5c5048;
      --text-muted: #9e8878;
      --glass-bg: linear-gradient(145deg, rgba(255,255,255,0.72) 0%, rgba(255,255,255,0.42) 40%, rgba(255,248,240,0.38) 100%);
      --glass-shadow: 0 8px 32px rgba(120,90,60,0.10), 0 2px 8px rgba(120,90,60,0.07), inset 0 1.5px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(180,155,130,0.12);
      --ink: #18120e;
      --orange-deep: #c2410c;
      --font: 'Plus Jakarta Sans', sans-serif;
      --line: rgba(24, 18, 14, 0.1);
    }
    html, body {
      min-height: 100%;
      font-family: var(--font);
      background: #fff;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }

    .bg-canvas { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #fff; }
    .bg-canvas::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(160deg, #fff 0%, #fff 28%, rgba(255,247,237,0.92) 50%, rgba(254,215,170,0.45) 75%, rgba(249,115,22,0.14) 100%);
    }
    .bg-canvas::after {
      content: ''; position: absolute; inset: 0;
      background: url("/assets/noise.png") repeat; background-size: 256px 256px;
      opacity: 0.12; pointer-events: none;
    }
    .blob { position: absolute; border-radius: 50%; filter: blur(100px); }
    .blob-1 { width: 640px; height: 640px; top: -220px; left: 40%; background: radial-gradient(circle, rgba(251,146,60,0.26) 0%, transparent 70%); }
    .blob-2 { width: 420px; height: 420px; bottom: -120px; right: -60px; background: radial-gradient(circle, rgba(253,186,116,0.22) 0%, transparent 70%); }

    .nav {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 64px); max-width: 1152px; z-index: 1000;
      background: var(--glass-bg); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.82); border-bottom-color: rgba(200,185,170,0.35);
      border-radius: 9999px; padding: 10px 28px; box-shadow: var(--glass-shadow);
      display: flex; justify-content: space-between; align-items: center;
    }
    .nav-brand { display: flex; align-items: center; gap: 10px; }
    .nav-brand svg { width: 30px; height: 30px; }
    .nav-brand-name { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; }
    .nav-center { display: none; gap: 32px; }
    @media (min-width: 768px) { .nav-center { display: flex; } }
    .nav-center a { color: var(--text-muted); font-size: 0.875rem; font-weight: 500; }
    .nav-center a:hover { color: var(--text-primary); }
    .nav-right { display: flex; align-items: center; gap: 20px; }
    .nav-login { color: var(--text-muted); font-size: 0.875rem; font-weight: 600; display: none; }
    @media (min-width: 640px) { .nav-login { display: block; } }
    .btn-pill {
      background: var(--ink); color: #fff; font-size: 13.5px; font-weight: 600;
      padding: 9px 20px; border-radius: 100px; display: inline-flex; align-items: center; gap: 7px;
      transition: all 0.3s ease;
    }
    .btn-pill:hover { background: var(--orange-deep); box-shadow: 0 8px 24px rgba(234,88,12,0.3); }
    .btn-pill svg { width: 13px; height: 13px; }

    body { padding-top: 100px; padding-bottom: 48px; }

    .clip-wrap {
      position: relative; z-index: 2;
      width: min(420px, calc(100% - 28px));
      margin: 0 auto;
    }
    .phone {
      position: relative; border-radius: 28px; overflow: hidden;
      background: #0c0a09; aspect-ratio: 9 / 16;
      box-shadow: 0 40px 80px rgba(20,17,15,0.22), 0 0 0 1px rgba(255,255,255,0.06) inset;
    }
    .phone video { width: 100%; height: 100%; object-fit: cover; display: block; background: #111; }
    .phone-skel {
      position: absolute; inset: 0;
      background: linear-gradient(110deg, #1c1917 0%, #292524 42%, #1c1917 100%);
      background-size: 200% 100%; animation: shimmer 1.1s linear infinite;
    }
    @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
    .overlay-fade {
      position: absolute; left: 0; right: 0; bottom: 0; height: 42%;
      background: linear-gradient(to top, rgba(0,0,0,0.72), transparent);
      pointer-events: none;
    }
    .creator-rail {
      position: absolute; left: 14px; right: 72px; bottom: 18px; z-index: 3;
      display: flex; flex-direction: column; gap: 10px; color: #fff;
      text-shadow: 0 1px 8px rgba(0,0,0,0.45);
    }
    .creator-row {
      display: flex; align-items: center; gap: 10px; cursor: pointer; width: fit-content; max-width: 100%;
      background: none; border: none; color: inherit; text-align: left; padding: 0;
    }
    .creator-avatar, .creator-avatar-fallback {
      width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.92);
    }
    .creator-avatar { object-fit: cover; }
    .creator-avatar-fallback {
      display: grid; place-items: center; font-weight: 800; font-size: 14px; color: #fff;
      background: linear-gradient(135deg, #f97316, #c2410c);
    }
    .creator-name { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; }
    .creator-handle { font-size: 12px; font-weight: 600; opacity: 0.88; }
    .name-badges {
      display: inline-flex !important;
      align-items: center;
      gap: 4px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .name-badges .solis-user-badge,
    .name-badges .solis-badge-row { display: inline-flex !important; }
    .clip-caption {
      font-size: 13px; font-weight: 500; line-height: 1.35; opacity: 0.92;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .sol-chip { font-size: 11px; font-weight: 700; opacity: 0.75; }
    .side-actions {
      position: absolute; right: 10px; bottom: 88px; z-index: 4;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .side-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .side-btn {
      width: 46px; height: 46px; border-radius: 50%; border: none; cursor: pointer;
      background: rgba(255,255,255,0.16); backdrop-filter: blur(12px); color: #fff;
      display: grid; place-items: center;
    }
    .side-btn svg { width: 20px; height: 20px; }
    .side-label { font-size: 10px; font-weight: 700; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,0.5); }

    .tap-play {
      position: absolute; inset: 0; z-index: 2;
      display: grid; place-items: center;
      background: transparent; border: none; cursor: pointer; color: rgba(255,255,255,0.92);
    }
    .tap-play[hidden] { display: none !important; }
    .tap-play .play-orb {
      width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center;
      background: rgba(255,255,255,0.12); border: 1.5px solid rgba(255,255,255,0.35);
      backdrop-filter: blur(14px) saturate(140%);
      box-shadow: 0 8px 28px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.25);
    }
    .tap-play .play-orb svg { width: 26px; height: 26px; transform: translateX(2px); }

    .profile-wrap {
      position: relative; z-index: 2;
      width: min(560px, calc(100% - 32px));
      margin: 0 auto;
    }
    .profile-card {
      border-radius: 28px;
      background: var(--glass-bg);
      border: 1px solid rgba(255,255,255,0.82);
      border-bottom-color: rgba(200,185,170,0.35);
      box-shadow: var(--glass-shadow);
      backdrop-filter: blur(20px) saturate(160%);
      overflow: visible;
    }
    .profile-banner {
      position: relative;
      z-index: 0;
      height: 120px;
      overflow: hidden;
      border-radius: 28px 28px 0 0;
      background: #f7f5f2;
      --poly-a: #ffffff;
      --poly-b: #f3f1ee;
      --poly-c: #ebe7e2;
      --poly-d: #e4dfd8;
      --poly-e: #d9d3cb;
    }
    .profile-banner svg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      display: block;
      pointer-events: none;
    }
    .profile-body {
      position: relative;
      z-index: 1;
      padding: 0 28px 28px;
      background: linear-gradient(145deg, rgba(255,255,255,0.92) 0%, rgba(255,252,248,0.88) 100%);
      border-radius: 0 0 28px 28px;
    }
    .profile-avatar-row {
      display: flex; align-items: flex-end; justify-content: space-between;
      margin-top: -48px; margin-bottom: 16px; gap: 16px;
      position: relative;
      z-index: 3;
    }
    .profile-avatar, .profile-avatar-fallback {
      position: relative;
      z-index: 4;
      width: 96px; height: 96px; border-radius: 50%;
      border: 4px solid #fff;
      box-shadow: 0 10px 28px rgba(234,88,12,0.2);
      flex-shrink: 0;
      background-clip: padding-box;
    }
    .profile-meta .dot,
    .profile-sol,
    .sol-chip { display: none !important; }
    .profile-avatar { object-fit: cover; background: #fff; display: block; }
    .profile-avatar-fallback {
      display: grid; place-items: center;
      font-size: 32px; font-weight: 800; color: #fff;
      background: linear-gradient(135deg, #f97316, #c2410c);
    }
    .follow-btn {
      min-height: 42px; padding: 0 22px; border-radius: 999px; border: none;
      font-size: 14px; font-weight: 700; cursor: pointer;
      color: #fff;
      background: linear-gradient(145deg, #fb923c, #ea580c 55%, #c2410c);
      box-shadow: 0 10px 24px rgba(234,88,12,0.28);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    .follow-btn:hover { box-shadow: 0 14px 28px rgba(234,88,12,0.34); filter: brightness(1.04); }
    .follow-btn.is-following {
      background: rgba(255,255,255,0.85);
      color: var(--text-primary);
      border: 1px solid var(--line);
      box-shadow: none;
    }
    .follow-btn:disabled { opacity: 0.65; cursor: wait; }
    .profile-name-row {
      display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
      margin-bottom: 6px;
    }
    .profile-name {
      font-size: 1.55rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15;
    }
    .profile-meta {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
      color: var(--text-secondary); font-size: 14px; font-weight: 600;
      margin-bottom: 14px;
    }
    .profile-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-muted); }
    .profile-sol {
      font-size: 12px; font-weight: 700; color: var(--orange-deep);
      background: rgba(249,115,22,0.1); padding: 4px 10px; border-radius: 999px;
    }
    .profile-bio {
      color: var(--text-secondary); font-size: 15px; line-height: 1.55;
      margin-bottom: 20px; max-width: 42ch;
    }
    .profile-stats {
      display: flex; gap: 28px; padding-top: 18px;
      border-top: 1px solid var(--line);
    }
    .stat strong {
      display: block; font-size: 1.15rem; font-weight: 800; letter-spacing: -0.02em;
    }
    .stat span { font-size: 12px; font-weight: 600; color: var(--text-muted); }

    .empty-state, .error {
      position: relative; z-index: 2;
      width: min(420px, calc(100% - 32px));
      margin: 80px auto; text-align: center;
    }
    .empty-state h1, .error h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 8px; }
    .empty-state p, .error p { color: var(--text-secondary); margin-bottom: 20px; }

    .modal {
      position: fixed; inset: 0; z-index: 50;
      display: grid; place-items: center;
      background: rgba(20,17,15,0.45); backdrop-filter: blur(8px); padding: 20px;
    }
    .modal[hidden] { display: none !important; }
    .modal-card {
      width: min(400px, 100%); padding: 28px 24px; border-radius: 22px;
      background: #fff; box-shadow: 0 30px 80px rgba(0,0,0,0.25); text-align: center;
    }
    .modal-card h3 { font-size: 1.35rem; font-weight: 800; margin-bottom: 8px; }
    .modal-card p { color: var(--text-secondary); font-size: 14px; margin-bottom: 20px; }
    .modal-actions { display: grid; gap: 8px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 48px; border-radius: 14px; border: none;
      font: 700 14px/1 var(--font); cursor: pointer;
    }
    .btn-primary {
      color: #fff;
      background: linear-gradient(145deg, #fb923c, #ea580c 55%, #c2410c);
    }
    .btn-ghost { background: #fff; border: 1px solid var(--line); color: var(--ink); }

    [hidden] { display: none !important; }

    @media (max-width: 640px) {
      .nav { width: calc(100% - 24px); padding: 8px 16px; top: 14px; }
      body { padding-top: 78px; }
      .phone { border-radius: 18px; }
      .profile-body { padding: 0 20px 22px; }
    }
  </style>
</head>
<body>
  <div class="bg-canvas" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <nav class="nav">
    <a href="/" class="nav-brand">
      <svg viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <circle cx="50" cy="50" r="12" fill="#ea580c"/>
        <ellipse rx="44" ry="18" cx="50" cy="50" stroke="#ea580c" stroke-width="6" transform="rotate(45 50 50)"/>
        <ellipse rx="44" ry="18" cx="50" cy="50" stroke="#ea580c" stroke-width="6" transform="rotate(-45 50 50)"/>
      </svg>
      <span class="nav-brand-name">Solis AI</span>
    </a>
    <div class="nav-center">
      <a href="/premium.html#features">Features</a>
      <a href="/#_how">How it works</a>
      <a href="/premium.html#pricing">Pricing</a>
    </div>
    <div class="nav-right">
      <a href="/login.html" class="nav-login">Login</a>
      <a href="/login.html" class="btn-pill" id="navStartFree">
        Start free
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
      </a>
    </div>
  </nav>

  <main id="clipRoot" class="clip-wrap" hidden>
    <div class="phone">
      <div class="phone-skel" id="skel" aria-hidden="true"></div>
      <video id="previewVideo" playsinline loop preload="metadata"></video>
      <button type="button" class="tap-play" id="tapPlay" hidden aria-label="Play">
        <span class="play-orb">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round">
            <path d="M9.2 6.8v10.4L18.4 12 9.2 6.8z"/>
          </svg>
        </span>
      </button>
      <div class="overlay-fade" aria-hidden="true"></div>
      <div class="side-actions">
        <div class="side-item">
          <button type="button" class="side-btn" id="downloadBtn" aria-label="Download">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
          </button>
          <span class="side-label">Save</span>
        </div>
        <div class="side-item">
          <button type="button" class="side-btn" id="shareBtn" aria-label="Copy link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 3.9M15.4 6.6l-6.8 3.9"/></svg>
          </button>
          <span class="side-label">Share</span>
        </div>
      </div>
      <div class="creator-rail">
        <button type="button" class="creator-row" id="creatorLink">
          <img class="creator-avatar" id="creatorAvatar" alt="" hidden />
          <div class="creator-avatar-fallback" id="creatorFallback">S</div>
          <div>
            <div class="creator-name">
              <span id="creatorName">Creator</span>
              <span class="name-badges" id="clipBadges"></span>
            </div>
            <div class="creator-handle" id="creatorHandle">@creator</div>
          </div>
        </button>
        <p class="clip-caption" id="clipCaption"></p>
      </div>
    </div>
  </main>

  <main id="profileRoot" class="profile-wrap" hidden>
    <div class="profile-card">
      <div class="profile-banner" id="profileBanner" aria-hidden="true">
        <svg viewBox="0 0 560 132" preserveAspectRatio="none">
          <polygon points="0,0 140,0 70,70" fill="var(--poly-a)"/>
          <polygon points="140,0 280,0 210,55" fill="var(--poly-b)"/>
          <polygon points="280,0 420,0 350,72" fill="var(--poly-c)"/>
          <polygon points="420,0 560,0 490,48" fill="var(--poly-a)"/>
          <polygon points="0,0 70,70 0,132" fill="var(--poly-d)"/>
          <polygon points="70,70 210,55 140,132" fill="var(--poly-c)"/>
          <polygon points="210,55 350,72 280,132" fill="var(--poly-e)"/>
          <polygon points="350,72 490,48 420,132" fill="var(--poly-b)"/>
          <polygon points="490,48 560,0 560,132" fill="var(--poly-d)"/>
          <polygon points="0,132 140,132 70,70" fill="var(--poly-b)"/>
          <polygon points="140,132 280,132 210,55" fill="var(--poly-a)"/>
          <polygon points="280,132 420,132 350,72" fill="var(--poly-d)"/>
          <polygon points="420,132 560,132 490,48" fill="var(--poly-c)"/>
        </svg>
      </div>
      <div class="profile-body">
        <div class="profile-avatar-row">
          <img class="profile-avatar" id="pAvatar" alt="" hidden />
          <div class="profile-avatar-fallback" id="pAvatarFallback">S</div>
          <button type="button" class="follow-btn" id="followBtn">Follow</button>
        </div>
        <div class="profile-name-row">
          <h1 class="profile-name" id="pName">Creator</h1>
          <span id="pBadges" class="name-badges"></span>
        </div>
        <div class="profile-meta">
          <span id="pHandle">@creator</span>
        </div>
        <p class="profile-bio" id="pBio" hidden></p>
        <div class="profile-stats">
          <div class="stat">
            <strong id="pFollowers">0</strong>
            <span>Followers</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="error" id="pageError" hidden>
    <h1>Not found</h1>
    <p id="pageErrorMsg">This link may be expired or invalid.</p>
    <a class="btn btn-primary" href="/login.html" style="display:inline-flex;min-width:180px;">Start free</a>
  </div>

  <div class="modal" id="signupWall" hidden>
    <div class="modal-card" role="dialog">
      <h3 id="wallTitle">Sign in to continue</h3>
      <p id="wallMsg">Create a free Solis account to follow creators and download clips.</p>
      <div class="modal-actions">
        <a class="btn btn-primary" id="wallLogin" href="/login.html">Start free</a>
        <button type="button" class="btn btn-ghost" id="wallClose">Not now</button>
      </div>
    </div>
  </div>
</body>
</html>
