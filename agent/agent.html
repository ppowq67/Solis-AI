<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Solis Agent</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  :root {
    --bg: #f4f4f2;
    --bg-2: #eaeae7;
    --text: #17171a;
    --text-dim: #6b6b70;
    --text-faint: #9a9a9e;
    --panel: rgba(255,255,255,0.55);
    --panel-border: rgba(255,255,255,0.8);
    --panel-inset: rgba(255,255,255,0.9);
    --chip: rgba(255,255,255,0.6);
    --chip-border: rgba(0,0,0,0.08);
    --accent: #17171a;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 12% 8%, rgba(120,170,255,0.16), transparent 38%),
      radial-gradient(circle at 88% 15%, rgba(255,150,210,0.16), transparent 38%),
      radial-gradient(circle at 60% 95%, rgba(160,255,210,0.13), transparent 38%),
      radial-gradient(circle at 30% 70%, rgba(255,220,150,0.10), transparent 42%),
      var(--bg);
    color: var(--text);
    font-family: "Inter", "SF Pro Display", "Helvetica Neue", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    letter-spacing: -0.014em;
    transition: background 0.3s ease, color 0.3s ease;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;
    border-bottom: 1px solid var(--chip-border);
    backdrop-filter: blur(20px);
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: -0.02em;
  }
  .logo-mark {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
  }
  .beta {
    background: var(--chip);
    border: 1px solid var(--chip-border);
    color: var(--text-dim);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.03em;
    padding: 2px 7px;
    border-radius: 5px;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .signin {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
  }

  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 70px 20px 50px;
  }

  h1 {
    text-align: center;
    font-size: 44px;
    font-weight: 700;
    letter-spacing: -0.03em;
    margin: 10px 0 42px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  #headlineCanvas {
    display: block;
  }

  .prompt-box {
    max-width: 720px;
    margin: 0 auto;
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 26px;
    padding: 20px 22px 16px;
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    box-shadow:
      0 1px 1px rgba(255,255,255,0.6) inset,
      0 -1px 12px rgba(0,0,0,0.04) inset,
      0 20px 50px -12px rgba(0,0,0,0.14),
      0 4px 12px rgba(0,0,0,0.05);
    overflow: hidden;
  }
    box-shadow:
      0 1px 1px rgba(255,255,255,0.1) inset,
      0 -1px 16px rgba(0,0,0,0.3) inset,
      0 20px 60px -12px rgba(0,0,0,0.6),
      0 4px 16px rgba(0,0,0,0.4);
  }
  .prompt-box::before {
    content: "";
    position: absolute;
    inset: -60%;
    background: conic-gradient(from 120deg,
      rgba(140,170,255,0.16),
      rgba(255,170,210,0.16),
      rgba(170,255,210,0.13),
      rgba(255,220,150,0.14),
      rgba(140,170,255,0.16));
    filter: blur(50px);
    opacity: 0.6;
    pointer-events: none;
    animation: drift 18s ease-in-out infinite alternate;
  }
  @keyframes drift {
    0% { transform: rotate(0deg) scale(1); }
    100% { transform: rotate(25deg) scale(1.1); }
  }
  .prompt-box::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
  }
  .prompt-text {
    position: relative;
    color: var(--text-faint);
    font-size: 15px;
    margin-bottom: 20px;
  }
  .prompt-text b { color: var(--text-dim); font-weight: 500; }

  .prompt-input {
    position: relative;
    width: 100%;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    font-weight: 450;
    letter-spacing: -0.012em;
    line-height: 1.5;
    padding: 4px 4px 18px;
    margin-bottom: 4px;
  }
  .prompt-input::placeholder { color: var(--text-faint); }

  .prompt-controls {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding-top: 14px;
    border-top: 1px solid var(--chip-border);
  }
  .left-controls, .right-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--chip);
    border: 1px solid var(--chip-border);
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset;
  }
  .icon-btn svg { width: 16px; height: 16px; display: block; }

  .template-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--chip);
    border: 1px solid var(--chip-border);
    color: var(--text);
    padding: 0 14px 0 12px;
    height: 36px;
    border-radius: 18px;
    font-family: "Inter", sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -0.01em;
    cursor: pointer;
    box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset;
  }
  .template-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
  .template-btn .chev { width: 11px; height: 11px; color: var(--text-faint); }

  .mode-pill {
    display: none;
    align-items: center;
    gap: 6px;
    color: var(--text-faint);
    font-size: 12px;
    font-weight: 500;
  }
  .mode-pill svg { width: 13px; height: 13px; }

  .auto-pill {
    display: flex;
    align-items: center;
    height: 36px;
    background: var(--chip);
    border: 1px solid var(--chip-border);
    border-radius: 18px;
    padding: 0 4px 0 13px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset;
    gap: 8px;
  }
  .auto-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8fb8ff, #ffb3d6);
    flex-shrink: 0;
  }
  .auto-label { letter-spacing: -0.01em; }
  .auto-caret {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--panel-inset);
    border: 1px solid var(--chip-border);
    color: var(--text);
    flex-shrink: 0;
    box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 3px 8px rgba(0,0,0,0.10);
  }
  .auto-caret svg { width: 15px; height: 15px; display: block; }

  .send-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    box-shadow: 0 6px 14px -4px rgba(0,0,0,0.35);
  }
  .send-btn svg { width: 18px; height: 18px; display: block; }

  .template-label {
    text-align: center;
    color: var(--text-faint);
    font-size: 14px;
    margin: 54px 0 22px;
  }
  .carousel {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 56px;
    perspective: 1000px;
  }
  .carousel-arrow {
    width: 42px;
    height: 42px;
    min-width: 42px;
    border-radius: 50%;
    background: var(--panel-inset);
    border: 1px solid var(--panel-border);
    color: var(--text);
    cursor: pointer;
    flex-shrink: 0;
    align-self: center;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    position: relative;
    z-index: 20;
    box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 6px 16px rgba(0,0,0,0.08);
  }
  .carousel-arrow svg {
    width: 20px;
    height: 20px;
    display: block;
  }

  .cards {
    display: flex;
    padding: 24px 0 34px;
    transform-style: preserve-3d;
  }
  .card {
    width: 132px;
    height: 104px;
    margin-left: -24px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 17px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 600;
    backdrop-filter: blur(18px) saturate(170%);
    -webkit-backdrop-filter: blur(18px) saturate(170%);
    color: var(--text);
    position: relative;
    transform-style: preserve-3d;
    transform-origin: bottom center;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.55) inset,
      0 28px 44px -14px rgba(0,0,0,0.22),
      0 10px 16px -4px rgba(0,0,0,0.10);
  }
    box-shadow:
      0 1px 0 rgba(255,255,255,0.08) inset,
      0 28px 50px -14px rgba(0,0,0,0.65),
      0 10px 18px -4px rgba(0,0,0,0.4);
  }
  .card:first-child { margin-left: 0; }
  .card:nth-child(1) { transform: rotateZ(-9deg) rotateY(18deg) rotateX(5deg) translateY(14px) translateZ(-26px); z-index: 1; }
  .card:nth-child(2) { transform: rotateZ(-5deg) rotateY(9deg) rotateX(2deg) translateY(5px) translateZ(-6px); z-index: 2; }
  .card:nth-child(3) { transform: rotateZ(0deg) rotateX(0deg) translateY(-10px) translateZ(14px) scale(1.05); z-index: 4; }
  .card:nth-child(4) { transform: rotateZ(5deg) rotateY(-9deg) rotateX(2deg) translateY(5px) translateZ(-6px); z-index: 2; }
  .card:nth-child(5) { transform: rotateZ(9deg) rotateY(-18deg) rotateX(5deg) translateY(14px) translateZ(-26px); z-index: 1; }
  .card:nth-child(1):hover { transform: rotateZ(-9deg) rotateY(15deg) rotateX(2deg) translateY(-4px) translateZ(-10px); z-index: 5; }
  .card:nth-child(2):hover { transform: rotateZ(-5deg) rotateY(8deg) rotateX(1deg) translateY(-14px) translateZ(6px); z-index: 5; }
  .card:nth-child(3):hover { transform: rotateZ(0deg) rotateX(0deg) translateY(-26px) translateZ(30px) scale(1.06); z-index: 5; }
  .card:nth-child(4):hover { transform: rotateZ(5deg) rotateY(-8deg) rotateX(1deg) translateY(-14px) translateZ(6px); z-index: 5; }
  .card:nth-child(5):hover { transform: rotateZ(9deg) rotateY(-15deg) rotateX(2deg) translateY(-4px) translateZ(-10px); z-index: 5; }
  .card svg { width: 20px; height: 20px; color: var(--text-dim); }
  .card-icon {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, rgba(140,170,255,0.16), rgba(255,170,210,0.14));
    border: 1px solid var(--chip-border);
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), background 0.2s ease, border-color 0.2s ease;
  }
  .card-icon svg { width: 17px; height: 17px; color: var(--text-dim); transition: color 0.2s ease; }
  .card-label { color: var(--text); font-weight: 650; transition: color 0.2s ease, letter-spacing 0.2s ease; }
  .card.center {
    background: var(--chip);
    border-color: var(--panel-border);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.6) inset,
      0 24px 40px -10px rgba(0,0,0,0.2),
      0 6px 14px rgba(0,0,0,0.08);
  }
  .card.center .card-icon {
    background: linear-gradient(160deg, rgba(140,170,255,0.28), rgba(255,170,210,0.24));
    border-color: rgba(255,255,255,0.5);
  }
    box-shadow:
      0 1px 0 rgba(255,255,255,0.1) inset,
      0 24px 44px -10px rgba(0,0,0,0.6),
      0 6px 16px rgba(0,0,0,0.35);
  }
  .card.center svg { color: var(--text); }

  .blank-link {
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    margin: 30px 0 56px;
    cursor: pointer;
  }
  .blank-link svg { width: 12px; height: 12px; vertical-align: -1px; margin-left: 2px; }

  .projects-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .projects-title {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.01em;
  }
  .header-right { display: flex; gap: 10px; }

  .search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--chip);
    border: 1px solid var(--chip-border);
    border-radius: 10px;
    padding: 8px 14px;
    color: var(--text-faint);
    font-size: 13px;
    width: 220px;
  }
  .search-box svg { width: 14px; height: 14px; }

  .view-toggle {
    display: flex;
    background: var(--chip);
    border: 1px solid var(--chip-border);
    border-radius: 10px;
    overflow: hidden;
  }
  .view-toggle button {
    background: transparent;
    border: none;
    color: var(--text-faint);
    padding: 8px 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
  }
  .view-toggle button.active { color: var(--text); background: var(--panel-inset); }
  .view-toggle svg { width: 14px; height: 14px; }

  .projects-box {
    border: 1px dashed var(--chip-border);
    border-radius: 16px;
    padding: 80px 0;
    text-align: center;
    color: var(--text-faint);
    font-size: 14px;
  }

  button { cursor: pointer; }

  .signin:hover { color: var(--text-dim); }

  .icon-btn:hover { background: var(--panel-inset); border-color: rgba(0,0,0,0.14); }

  .template-btn:hover { background: var(--panel-inset); border-color: rgba(0,0,0,0.16); }

  .auto-pill:hover { background: var(--panel-inset); border-color: rgba(0,0,0,0.16); }

  .send-btn:hover { box-shadow: 0 8px 18px -4px rgba(0,0,0,0.45); filter: brightness(1.12); }

  .carousel-arrow:hover { background: var(--panel-inset); border-color: rgba(0,0,0,0.16); box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 8px 20px rgba(0,0,0,0.12); }

  .card { cursor: pointer; }
  .card:hover { border-color: rgba(0,0,0,0.18); box-shadow: 0 1px 0 rgba(255,255,255,0.65) inset, 0 0 0 1px rgba(255,255,255,0.5) inset, 0 26px 42px -10px rgba(0,0,0,0.24), 0 8px 16px rgba(0,0,0,0.10); }
  .card:hover .card-icon {
    background: linear-gradient(160deg, rgba(140,170,255,0.35), rgba(255,170,210,0.3));
    border-color: rgba(255,255,255,0.6);
    transform: scale(1.12) rotate(-6deg);
  }
  .card:hover .card-icon svg { color: var(--text); }
  .card:hover .card-label { letter-spacing: 0.005em; }

  .blank-link:hover { color: var(--text); }
  .blank-link:hover svg { transform: translateX(2px); }
  .blank-link svg { transition: transform 0.15s ease; }

  .view-toggle button:hover:not(.active) { color: var(--text-dim); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg class="logo-mark" viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="11" fill="#17171a" stroke="none"/>
      <ellipse rx="44" ry="18" cx="50" cy="50" stroke="#17171a" stroke-width="6" transform="rotate(45 50 50)"/>
      <ellipse rx="44" ry="18" cx="50" cy="50" stroke="#17171a" stroke-width="6" transform="rotate(-45 50 50)"/>
    </svg>
    Solis Agent <span class="beta">Beta</span>
  </div>
  <div class="header-actions">
    <div class="signin">Sign in</div>
  </div>
</header>

<main>
  <h1><canvas id="headlineCanvas" width="900" height="80"></canvas></h1>

  <div class="prompt-box">
    <textarea class="prompt-input" placeholder="Paste a podcast, webinar, or long-form video link to repurpose" rows="2"></textarea>
    <div class="prompt-controls">
      <div class="left-controls">
        <button class="icon-btn" aria-label="Attach">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a5.5 5.5 0 0 1-7.78-7.78l9.2-9.19a3.5 3.5 0 1 1 4.95 4.95L9.41 17.41a1.5 1.5 0 0 1-2.12-2.12l8.49-8.49"/></svg>
        </button>
        <button class="template-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>Template</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="mode-pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="12" rx="2"/><path d="M17 10l4-2v8l-4-2"/></svg>
          <span>Long → Short</span>
        </div>
      </div>
      <div class="right-controls">
        <div class="auto-pill">
          <span class="auto-dot"></span>
          <span class="auto-label">Auto</span>
          <span class="auto-caret">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </span>
        </div>
        <button class="send-btn" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5c.4 0 .78.16 1.06.44l6.5 6.5a1.5 1.5 0 0 1-2.12 2.12l-3.94-3.94V19a1.5 1.5 0 0 1-3 0V8.62l-3.94 3.94a1.5 1.5 0 0 1-2.12-2.12l6.5-6.5c.28-.28.66-.44 1.06-.44z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="template-label">Start with a template...</div>

  <div class="carousel">
    <button class="carousel-arrow" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <div class="cards">
      <div class="card"><div class="card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></div><span class="card-label">Product ad</span></div>
      <div class="card"><div class="card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l1.8 5.6L19 9l-5.2 1.4L12 16l-1.8-5.6L5 9l5.2-1.4L12 2z"/><path d="M19 15l.7 2.3L22 18l-2.3.7L19 21l-.7-2.3L16 18l2.3-.7L19 15z"/></svg></div><span class="card-label">Software ad</span></div>
      <div class="card center"><div class="card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg></div><span class="card-label">AI motion</span></div>
      <div class="card"><div class="card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M9 22h6"/></svg></div><span class="card-label">Talking head</span></div>
      <div class="card"><div class="card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M9 6l1-2h4l1 2"/></svg></div><span class="card-label">Vlog story</span></div>
    </div>
    <button class="carousel-arrow" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>

  <div class="blank-link">...or start a blank project
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
  </div>

  <div class="projects-header">
    <div class="projects-title">Projects</div>
    <div class="header-right">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        Search
      </div>
      <div class="view-toggle">
        <button class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
        <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
      </div>
    </div>
  </div>

  <div class="projects-box">Sign in to see your projects.</div>
</main>

<script>
  const headlines = [
    "What are we making today?",
    "Turn one video into ten.",
    "Long-form to short-form, fast.",
    "Repurpose your best moments.",
    "What's the next clip today?"
  ];
  let idx = 0;
  const canvas = document.getElementById('headlineCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const DPR = Math.min(window.devicePixelRatio || 1, 3); // crisp on retina/4K
  const CSS_W = 900, CSS_H = 80;
  canvas.width = CSS_W * DPR;
  canvas.height = CSS_H * DPR;
  canvas.style.width = CSS_W + 'px';
  canvas.style.height = CSS_H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const rootStyles = getComputedStyle(document.documentElement);
  const textColor = (rootStyles.getPropertyValue('--text') || '#17171a').trim();
  const textColorDim = (rootStyles.getPropertyValue('--text-dim') || '#6b6b70').trim();
  const FONT = "700 44px Inter, -apple-system, sans-serif";

  function drawCrispText(text) {
    ctx.clearRect(0, 0, CSS_W, CSS_H);
    ctx.font = FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.save();
    ctx.shadowColor = 'rgba(255,255,255,0.9)';
    ctx.shadowBlur = 3;
    ctx.shadowOffsetY = -1;
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(text, CSS_W / 2, CSS_H / 2 + 1);
    ctx.restore();

    const grad = ctx.createLinearGradient(0, CSS_H / 2 - 26, 0, CSS_H / 2 + 26);
    grad.addColorStop(0, textColor);
    grad.addColorStop(1, textColorDim);
    ctx.fillStyle = grad;
    ctx.fillText(text, CSS_W / 2, CSS_H / 2 + 1);
  }

  function sampleTextParticles(text) {
    const off = document.createElement('canvas');
    off.width = CSS_W; off.height = CSS_H;
    const octx = off.getContext('2d');
    octx.fillStyle = '#000';
    octx.font = FONT;
    octx.textAlign = 'center';
    octx.textBaseline = 'middle';
    octx.fillText(text, CSS_W / 2, CSS_H / 2 + 1);
    const data = octx.getImageData(0, 0, CSS_W, CSS_H).data;

    const particles = [];
    const step = 3.4; // sparser sampling = fewer particles = smoother animation
    for (let y = 0; y < CSS_H; y += step) {
      for (let x = 0; x < CSS_W; x += step) {
        const i = (Math.floor(y) * CSS_W + Math.floor(x)) * 4;
        if (data[i + 3] > 100) {
          particles.push({
            x, y,
            homeX: x, homeY: y,
            life: 1,
            size: 1.4 + Math.random() * 1.2,
            delay: (x / CSS_W) * 200 + Math.random() * 30
          });
        }
      }
    }
    return particles;
  }

  let particles = [];
  let nextParticles = null; // pre-sampled ahead of time to avoid mid-transition stutter
  let mode = 'idle'; // 'blowing' | 'forming' | 'idle'
  let modeStart = 0;
  let rafId = null;

  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function startBlow() {
    idx = (idx + 1) % headlines.length;
    nextParticles = sampleTextParticles(headlines[idx]);
    mode = 'blowing';
    modeStart = performance.now();
    if (!rafId) rafId = requestAnimationFrame(tick);
  }
  function startForm() {
    const fresh = nextParticles;
    for (const p of fresh) {
      p.startX = p.homeX - 160;
      p.startY = p.homeY;
      p.x = p.startX;
      p.y = p.startY;
      p.life = 0;
    }
    particles = fresh;
    nextParticles = null;
    mode = 'forming';
    modeStart = performance.now();
  }

  function tick(now) {
    const elapsed = now - modeStart;

    if (mode === 'blowing') {
      ctx.clearRect(0, 0, CSS_W, CSS_H);
      let allDone = true;
      for (const p of particles) {
        const t = elapsed - p.delay;
        const raw = Math.max(0, Math.min(t / 460, 1));
        if (raw < 1) allDone = false;
        const ease = easeInOutCubic(raw);
        p.x = p.homeX + ease * 260;
        p.y = p.homeY - ease * 40;
        p.life = 1 - ease;
      }
      drawParticles();
      if (allDone) {
        startForm();
      }
      rafId = requestAnimationFrame(tick);
    } else if (mode === 'forming') {
      ctx.clearRect(0, 0, CSS_W, CSS_H);
      let allDone = true;
      for (const p of particles) {
        const t = elapsed - p.delay;
        const raw = Math.max(0, Math.min(t / 460, 1));
        if (raw < 1) allDone = false;
        const ease = easeInOutCubic(raw);
        p.x = p.startX + (p.homeX - p.startX) * ease;
        p.y = p.startY + (p.homeY - p.startY) * ease;
        p.life = ease;
      }
      drawParticles();
      if (allDone) {
        drawCrispText(headlines[idx]);
        mode = 'idle';
        modeStart = now;
        rafId = null;
        setTimeout(startBlow, 3200);
        return;
      }
      rafId = requestAnimationFrame(tick);
    }
  }

  function drawParticles() {
    ctx.fillStyle = textColor;
    for (const p of particles) {
      if (p.life <= 0) continue;
      ctx.globalAlpha = p.life > 1 ? 1 : (p.life < 0 ? 0 : p.life);
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  particles = sampleTextParticles(headlines[0]);
  drawCrispText(headlines[0]);
  setTimeout(startBlow, 3200);
</script>

</body>
</html>
