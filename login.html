<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · Solis AI</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://solisai.video/" />
  <script>
  (function () {
    try {
      var p = new URLSearchParams(window.location.search || '');
      p.set('login', '1');
      var q = p.toString();
      window.location.replace('/' + (q ? '?' + q : '?login=1'));
    } catch (_) {
      window.location.replace('/?login=1');
    }
  })();
  </script>
</head>
<body>
  <p style="font-family:system-ui,sans-serif;text-align:center;margin-top:40vh;color:#5c5048;">
    Opening sign in… <a href="/?login=1">Continue</a>
  </p>
</body>
</html>
