<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solis AI Affiliate Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box_sizing: border-box; margin: 0; padding: 0; }
:root {
  --solis: #f97316;
  --solis_gradient: linear-gradient(135deg, #f97316, #d65a31, #ff8c42, #b84d1a);
  --solis_light: #fed7aa;
  --solis_xlight: #fff7ed;
  --white: #ffffff;
  --text_primary: #18120e;
  --text_secondary: #5c5048;
  --text_muted: #9e8878;
  --border: rgba(200, 185, 170, 0.35);
  --glass_bg: linear-gradient(145deg, rgba(255,255,255,0.72) 0%, rgba(255,255,255,0.42) 40%, rgba(255,248,240,0.38) 100%);
  --glass_shadow: 0 8px 32px rgba(120,90,60,0.10), 0 2px 8px rgba(120,90,60,0.07), inset 0 1.5px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(180,155,130,0.12), inset 1.5px 0 0 rgba(255,255,255,0.70), inset -1px 0 0 rgba(180,155,130,0.08);
  --ink: #18120e;
  --orange_deep: #c2410c;
  --frame_thick: 18px;
}
html, body {
  height: 100%;
  font-family: 'Manrope', sans-serif;
  background: #ffffff;
  color: var(--text_primary);
  overflow: hidden;
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
}
._page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 64px;
  padding: 40px;
  position: relative;
}
._lang_switch {
  position: absolute;
  top: 32px;
  right: 40px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  color: var(--text_secondary);
  background: var(--white);
  border: 1px solid var(--border);
  padding: 10px 16px;
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 6px 14px rgba(120,90,60,0.08);
}
._hero {
  width: 480px;
  height: 880px;
  border-radius: 40px;
  background: var(--solis_gradient);
  position: relative;
  overflow: hidden;
  padding: 40px;
  color: var(--white);
  display: flex;
  flex-direction: column;
  box-shadow: 0 30px 60px -20px rgba(194,65,12,0.45), 0 10px 24px rgba(194,65,12,0.25);
}
._ring_top {
  position: absolute;
  top: -60px;
  left: -60px;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.35);
}
._ring_bottom {
  position: absolute;
  bottom: -110px;
  right: -110px;
  width: 260px;
  height: 260px;
  border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.35);
}
._hero_link {
  font-size: 14px;
  font-weight: 600;
  color: rgba(255,255,255,0.9);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  align-self: center;
}
._hero_body {
  margin-top: 260px;
}
._hero_title {
  font-size: 38px;
  font-weight: 800;
  line-height: 1.15;
  letter-spacing: -0.5px;
}
._hero_sub {
  margin-top: 28px;
  font-size: 17px;
  font-weight: 500;
  color: rgba(255,255,255,0.92);
}
._card {
  width: 460px;
}
._card_title {
  font-size: 30px;
  font-weight: 800;
  color: var(--text_primary);
}
._card_desc {
  margin-top: 10px;
  font-size: 15px;
  color: var(--text_muted);
}
._field_label {
  margin-top: 32px;
  display: block;
  font-size: 14px;
  font-weight: 600;
  color: var(--text_primary);
  margin-bottom: 8px;
}
._input {
  width: 100%;
  padding: 16px 18px;
  border-radius: 18px;
  border: 1px solid var(--border);
  font-size: 15px;
  font-family: 'Manrope', sans-serif;
  color: var(--text_primary);
  background: var(--solis_xlight);
  outline: none;
  box-shadow: inset 0 1px 2px rgba(120,90,60,0.06), 0 6px 14px rgba(120,90,60,0.05);
  transition: box-shadow 0.15s ease, border-color 0.15s ease;
}
._input::placeholder { color: var(--text_muted); }
._input:focus {
  border-color: var(--solis);
  box-shadow: 0 0 0 4px var(--solis_light);
}
._button {
  margin-top: 20px;
  width: 100%;
  padding: 18px 18px;
  border: none;
  border-radius: 999px;
  background: linear-gradient(180deg, #ff9a4d 0%, var(--solis) 55%, #ea6a0c 100%);
  color: var(--white);
  font-size: 15px;
  font-weight: 700;
  font-family: 'Manrope', sans-serif;
  cursor: pointer;
  letter-spacing: 0.2px;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.5) inset,
    0 -6px 12px rgba(0,0,0,0.14) inset,
    0 14px 28px -8px rgba(194,65,12,0.55),
    0 4px 10px rgba(194,65,12,0.35);
  transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
}
._button:hover {
  transform: none;
  filter: brightness(1.04);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.55) inset,
    0 -6px 12px rgba(0,0,0,0.14) inset,
    0 18px 34px -8px rgba(194,65,12,0.6),
    0 6px 14px rgba(194,65,12,0.4);
}
._button:active {
  transform: translateY(1px) scale(0.99);
  filter: brightness(0.98);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.4) inset,
    0 -3px 8px rgba(0,0,0,0.18) inset,
    0 6px 14px -6px rgba(194,65,12,0.5);
}
._fine_print {
  margin-top: 16px;
  font-size: 13px;
  color: var(--text_muted);
}
._fine_print a {
  color: var(--orange_deep);
  text-decoration: underline;
}
@media (max-width: 900px) {
  ._page { flex-direction: column; gap: 32px; }
  ._hero { display: none; }
  ._card { width: 100%; max-width: 460px; }
}
</style>
</head>
<body>
<div class="_page">
  <div class="_lang_switch">English</div>
  <div class="_hero">
    <div class="_ring_top"></div>
    <a class="_hero_link" href="#">Get to know us more</a>
    <div class="_hero_body">
      <div class="_hero_title">Welcome to<br>Solis AI's Affiliate Program</div>
      <div class="_hero_sub">Earn 33% for every paid referral.</div>
    </div>
    <div class="_ring_bottom"></div>
  </div>
  <div class="_card">
    <div class="_card_title">Log in or Sign up</div>
    <div class="_card_desc">Enter your email below and we'll send you a verification code.</div>
    <label class="_field_label">Your email address</label>
    <input class="_input" type="email" placeholder="name@company.com">
    <button class="_button">Continue</button>
    <div class="_fine_print">Payouts are managed by <a href="#">Paddle</a>. By proceeding, you agree to the <a href="#">payout terms</a>.</div>
  </div>
</div>
</body>
</html>
